<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Google Sheet Portfolio</title>
    <style>
        :root {
            --primary: #0070f3;
            --background: #ffffff;
            --text: #333333;
            --gray: #eaeaea;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 0; background: var(--background); color: var(--text);
            line-height: 1.6;
        }
        header { max-width: 800px; margin: 0 auto; padding: 60px 20px 20px; text-align: center; }
        main { max-width: 800px; margin: 0 auto; padding: 20px; }
        section { margin-bottom: 60px; }
        h2 { border-bottom: 2px solid var(--gray); padding-bottom: 10px; }
        
        /* Grid Layout for Live Data */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #fafafa;
            border: 1px solid var(--gray);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            background: #eee;
        }

        /* Form Styling */
        form { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; }
        button { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0051a2; }
        #status-msg { text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Live Portfolio Database</h1>
        <p>Data below is fetched directly from Google Sheets via Vercel!</p>
    </header>

    <main>
        <section id="display-section">
            <h2>Profiles / Projects from Google Sheet</h2>
            <div id="loading">Loading live data...</div>
            <div class="grid" id="data-container"></div>
        </section>

        <section id="contact">
            <h2>Add or Change Data</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email (Used as ID to update)</label>
                    <input type="email" id="email" required placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="screenshot">Profile Picture / Image</label>
                    <input type="file" id="screenshot" accept="image/*">
                </div>
                <button type="submit" id="submitBtn">Submit Data</button>
            </form>
            <div id="status-msg"></div>
        </section>
    </main>

    <script>
        // 1. FETCH AND DISPLAY DATA ON LOAD
        function loadData() {
            const container = document.getElementById('data-container');
            const loadingDiv = document.getElementById('loading');
            
            fetch('/api/submit')
                .then(res => res.json())
                .then(resData => {
                    loadingDiv.style.display = 'none';
                    container.innerHTML = ''; // Clear old content
                    
                    if (resData.status === 'success' && resData.data.length > 0) {
                        resData.data.forEach(item => {
                            const card = document.createElement('div');
                            card.className = 'card';
                            
                            // Check if image link is valid, otherwise use placeholder
                            const imgSrc = item.imageUrl && item.imageUrl !== "គ្មានរូបភាព" ? item.imageUrl : "https://via.placeholder.com/100";
                            
                            card.innerHTML = `
                                <img src="${imgSrc}" alt="${item.name}">
                                <h3>${item.name}</h3>
                                <p style="color: #666; font-size: 0.9rem;">${item.email}</p>
                            `;
                            container.appendChild(card);
                        });
                    } else {
                        container.innerHTML = '<p>No records found in the sheet yet.</p>';
                    }
                })
                .catch(err => {
                    loadingDiv.innerText = "Failed to load live data.";
                    console.error("Error fetching data:", err);
                });
        }

        // Run loadData when page loads
        window.addEventListener('DOMContentLoaded', loadData);

        // 2. FORM SUBMISSION (POST)
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const statusMsg = document.getElementById('status-msg');
            const submitBtn = document.getElementById('submitBtn');
            
            statusMsg.style.color = "blue";
            statusMsg.innerText = "Processing...";
            submitBtn.disabled = true;

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const fileInput = document.getElementById('screenshot');
            const file = fileInput.files[0];

            const sendPayload = (base64Image = null, imageName = null) => {
                const payload = {
                    name: name,
                    email: email,
                    imageFile: base64Image,
                    imageName: imageName
                };

                fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    statusMsg.style.color = "green";
                    statusMsg.innerText = "Success! Sheet updated.";
                    document.getElementById('contactForm').reset();
                    loadData(); // RE-LOAD THE DATA AUTOMATICALLY TO SHOW CHANGES!
                })
                .catch(err => {
                    statusMsg.style.color = "red";
                    statusMsg.innerText = "Error saving data.";
                })
                .finally(() => {
                    submitBtn.disabled = false;
                });
            };

            // If user uploads an image, read it. If not, submit text only.
            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => sendPayload(reader.result, file.name);
            } else {
                sendPayload();
            }
        });
    </script>
</body>
</html>
