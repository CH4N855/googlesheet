<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Resume Portfolio</title>
    <style>
        :root {
            --bg-color: #030a16;
            --card-bg: #07152e;
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-muted: #8fa0bc;
            --border-color: #0f2547;
        }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 40px 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }
        
        /* Profile Header */
        header { text-align: center; margin-bottom: 60px; }
        header h1 { font-size: 3rem; margin: 0 0 10px 0; color: var(--text-main); }
        header p { color: var(--accent-cyan); font-size: 1.1rem; letter-spacing: 1px; }

        /* Section Layout */
        section { margin-bottom: 50px; }
        .section-title {
            font-size: 1.8rem; border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px; margin-bottom: 25px; text-transform: uppercase;
        }
        .section-title span { color: var(--accent-cyan); }

        /* Card Component */
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 25px; border-radius: 12px; margin-bottom: 20px;
            transition: transform 0.3s, border-color 0.3s;
        }
        .card:hover { transform: translateY(-3px); border-color: var(--accent-cyan); }
        .card h3 { margin: 0 0 10px 0; font-size: 1.3rem; color: var(--text-main); }
        .card h4 { margin: 0 0 10px 0; font-size: 1.1rem; color: var(--accent-cyan); font-weight: normal; }
        .card p { margin: 0; color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }
        .date-badge { font-size: 0.85rem; color: var(--text-muted); display: block; margin-top: 10px; font-style: italic; }

        .loading, .empty-state { text-align: center; color: var(--text-muted); font-style: italic; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="profile-name">Loading...</h1>
            <p>// Live Data from Google Sheets</p>
        </header>

        <section id="experience">
            <h2 class="section-title">បទពិសោធន៍ <span>Experience</span></h2>
            <div id="experience-loading" class="loading">កំពុងទាញទិន្នន័យ...</div>
            <div id="experience-container"></div>
        </section>

        <section id="study">
            <h2 class="section-title">ការសិក្សា <span>Education</span></h2>
            <div id="study-loading" class="loading">កំពុងទាញទិន្នន័យ...</div>
            <div id="study-container"></div>
        </section>
    </div>

    <script>
        // ប្រើប្រាស់ Route API របស់ Vercel ដែលអ្នកបានបង្កើតពីមុនមក (/api/submit)
        const API_URL = "/api/submit";

        async function fetchLiveSheetData() {
            try {
                const response = await fetch(API_URL);
                const res = await response.json();

                if (res.status === "success") {
                    // ១. បង្ហាញឈ្មោះ (Profile Name)
                    if (res.profile && res.profile.name) {
                        document.getElementById('profile-name').innerText = res.profile.name;
                    }

                    // ២. បង្ហាញបទពិសោធន៍ (Experience)
                    const expContainer = document.getElementById('experience-container');
                    document.getElementById('experience-loading').style.display = 'none';
                    if (res.experience && res.experience.length > 0) {
                        res.experience.forEach(exp => {
                            expContainer.innerHTML += `
                                <div class="card">
                                    <h3>${exp.title}</h3>
                                    <p>${exp.description}</p>
                                </div>`;
                        });
                    } else {
                        expContainer.innerHTML = '<div class="empty-state">មិនទាន់មានទិន្នន័យបទពិសោធន៍ឡើយ។</div>';
                    }

                    // ៣. បង្ហាញប្រវត្តិសិក្សា (Study / Education)
                    const studyContainer = document.getElementById('study-container');
                    document.getElementById('study-loading').style.display = 'none';
                    if (res.study && res.study.length > 0) {
                        res.study.forEach(st => {
                            studyContainer.innerHTML += `
                                <div class="card">
                                    <h3>${st.degree}</h3>
                                    <h4>${st.school}</h4>
                                    <span class="date-badge">ឆ្នាំសិក្សា៖ ${st.year}</span>
                                </div>`;
                        });
                    } else {
                        studyContainer.innerHTML = '<div class="empty-state">មិនទាន់មានទិន្នន័យការសិក្សាឡើយ។</div>';
                    }
                }
            } catch (error) {
                console.error("Error loading dynamic data:", error);
                document.querySelectorAll('.loading').forEach(el => el.innerText = "មានបញ្ហាក្នុងការទាញទិន្នន័យ!");
            }
        }

        window.addEventListener('DOMContentLoaded', fetchLiveSheetData);
    </script>
</body>
</html>
